name: Build

on:
  pull_request:

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: github-ubuntu-latest-s
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Mise
        uses: SonarSource/mise-action-wrapper@65aa289d3f408f4999d13a52a14cde4f54b48442 # 2.0.0
        with:
          version: 2026.3.13
          persist_github_token: false
      - name: Maven Build & Validate
        run: |
          mvn org.sonarsource.update-center:sonar-update-center-mojo:1.38.0.4919:generate-metadata \
            -DinputFile=update-center-source.properties \
            -DvalidateOnly=true \
            -DoutputDir=/tmp
